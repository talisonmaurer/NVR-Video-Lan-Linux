<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NVR Monitor</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:#eee;font:14px Arial,sans-serif}#monitorGrid{display:grid;width:100vw;height:100vh;gap:3px;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));grid-template-rows:repeat(var(--rows,3),minmax(0,1fr))}.tile{position:relative;min-width:0;min-height:0;background:#101820;overflow:hidden}.tile video{width:100%;height:100%;object-fit:contain}.label{position:absolute;left:5px;bottom:5px;background:#000b;padding:5px}.status{position:absolute;top:5px;left:5px;background:#000b;padding:5px}.empty{display:grid;place-items:center;color:#8594a4}
</style><script defer src="/hls.min.js"></script><script defer src="/monitor.js"></script></head><body><main id="monitorGrid"></main></body></html>
